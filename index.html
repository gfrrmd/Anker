<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>Anker — Jadwal KRL</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- FIXED HEADER -->
  <header class="header">
    <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    <span class="header-title">Jadwal KRL</span>
    <div class="clock" id="clock">--:--</div>
  </header>

  <!-- SCROLLABLE PAGE -->
  <div class="page">

    <!-- 1. STATION CARD (always visible, tap to change) -->
    <div class="station-card" id="stationCard" onclick="openSearch()">
      <div class="sc-label">STASIUN KAMU</div>
      <div class="sc-row">
        <span class="sc-dot" id="scDot"></span>
        <span class="sc-name" id="scName">Pilih Stasiun</span>
        <svg class="sc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>

    <!-- 2. DIRECTION FILTER (shown after station selected) -->
    <div class="filter-row" id="dirRow" style="display:none">
      <button class="fpill active" data-dir="ALL" onclick="setDir(this,'ALL')">Semua</button>
      <div id="dirBtns" style="display:contents"></div>
    </div>

    <!-- 3. HERO CARD (next train) -->
    <div id="heroSection" style="display:none">
      <div class="hero-pre-label">
        <span class="flash-dot"></span>
        <span>SEGERA BERANGKAT</span>
      </div>
      <div class="hero-card" id="heroCard">
        <div class="hero-top">
          <span class="hero-time" id="heroTime">--:--</span>
          <span class="hero-badge" id="heroBadge"></span>
        </div>
        <div class="hero-dest" id="heroDest">—</div>
        <div class="hero-cd" id="heroCD">--:--</div>
        <div class="hero-cd-lbl">mnt : dtk</div>
      </div>
    </div>

    <!-- 4. UPCOMING LIST -->
    <div id="listSection" style="display:none">
      <div class="seg-label">SELANJUTNYA</div>
      <div class="train-list" id="trainList"></div>
    </div>

    <!-- 5. EMPTY STATE (no station selected) -->
    <div id="emptyState" class="empty-state">
      <svg class="empty-svg" viewBox="0 0 80 80" fill="none">
        <rect x="20" y="10" width="40" height="50" rx="8" stroke="currentColor" stroke-width="3"/>
        <rect x="28" y="20" width="10" height="12" rx="2" fill="currentColor" opacity=".4"/>
        <rect x="42" y="20" width="10" height="12" rx="2" fill="currentColor" opacity=".4"/>
        <rect x="28" y="38" width="24" height="4" rx="2" fill="currentColor" opacity=".3"/>
        <circle cx="30" cy="52" r="4" fill="currentColor" opacity=".5"/>
        <circle cx="50" cy="52" r="4" fill="currentColor" opacity=".5"/>
        <path d="M16 65 h48" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <path d="M10 65 L16 65 M64 65 L70 65" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <p>Pilih stasiun untuk melihat<br>jadwal kereta mendatang</p>
    </div>

    <!-- 6. NO TRAINS -->
    <div id="noTrains" style="display:none" class="empty-state">
      <svg class="empty-svg" viewBox="0 0 80 80" fill="none">
        <circle cx="40" cy="40" r="28" stroke="currentColor" stroke-width="3"/>
        <path d="M28 28 L52 52 M52 28 L28 52" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <p>Tidak ada kereta mendatang<br>dalam 4 jam ke depan</p>
    </div>

  </div><!-- /page -->

  <!-- SEARCH OVERLAY -->
  <div class="search-overlay" id="searchOverlay" onclick="handleOverlayClick(event)">
    <div class="search-modal" id="searchModal">
      <div class="search-bar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" class="search-input" type="text" placeholder="Cari nama stasiun..." autocomplete="off"/>
        <button class="search-cancel" onclick="closeSearch()">Batal</button>
      </div>
      <ul id="searchList" class="search-list"></ul>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
